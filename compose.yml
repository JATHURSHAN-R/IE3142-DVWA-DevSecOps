volumes:
  dvwa:

networks:
  dvwa:

services:
  dvwa:
    build: .
    image: dvwa-team:local
    pull_policy: build
    environment:
      - DB_SERVER=db
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      - db
    networks:
      - dvwa
    ports:
      - 127.0.0.1:4280:80
    restart: unless-stopped

  db:
    image: docker.io/library/mariadb:10
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dvwa:/var/lib/mysql
    networks:
      - dvwa
