services:
  dvwa:
    build: .
    image: dvwa-team:local
    pull_policy: build
    environment:
      DB_SERVER: db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DVWA_PORT:-4280}:80"
    volumes: []
    networks:
      - dvwa

  db:
    image: mariadb:10
    environment:
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set root password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - dvwa:/var/lib/mysql
    networks:
      - dvwa

volumes:
  dvwa:

networks:
  dvwa:
