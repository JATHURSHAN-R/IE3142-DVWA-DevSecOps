name: Security Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy container gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and scan application image
        run: bash ci/container.sh

      - name: Upload container scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: reports/trivy/
          if-no-files-found: error
          retention-days: 30
